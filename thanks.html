<style>
:root{--bg:#F5F7FA;--surface:#fff;--ink:#0F1B2D;--muted:#51627A;--line:#D5DEE9;--deep:#0F1B2D;--deep2:#16294A;--go:#2EC27E;--go-ink:#06231A;--brand:#0F7A55;--soft:#E3F6EC;--warn:#FFF4D6;--warn-ink:#5A3B00;
 --fd:'Poppins','Hind','Noto Sans Devanagari',system-ui,sans-serif;--fb:'Hind','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1220;--surface:#111D31;--ink:#E8EFF8;--muted:#9DB0C8;--line:#25395A;--deep:#08101E;--deep2:#10203A;--brand:#43D6A0;--soft:#12332A;--warn:#33280E;--warn-ink:#F3D58A;color-scheme:dark}}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.65 var(--fb)}
h1,h2,h3{font-family:var(--fd);line-height:1.25;margin:0;text-wrap:balance}:lang(hi) h1,:lang(hi) h2,:lang(hi) h3{line-height:1.4}
p{margin:0}a{color:inherit}[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--deep);color:#F2F6FB;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:9}
.top .wrap{display:flex;justify-content:space-between;align-items:center;min-height:56px;gap:12px}
.logo{font:800 21px var(--fd);text-decoration:none}.logo span{color:var(--go)}
.lang{display:inline-flex;border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:#F2F6FB;font:600 13px var(--fb);padding:6px 12px;border-radius:999px;min-height:34px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--go);color:var(--go-ink)}
.hero{background:radial-gradient(110% 120% at 90% 0%,var(--deep2),var(--deep) 70%);color:#F2F6FB;padding:34px 0 40px}
.ok{width:56px;height:56px;border-radius:50%;background:var(--go);display:grid;place-items:center;margin-bottom:14px}
.ok svg{width:30px;height:30px}
.hero h1{font-size:clamp(28px,7vw,40px)}
.hero p{color:#A9B9D0;margin-top:8px}
.pname{margin-top:16px;display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 14px;font:600 16px var(--fd)}
main{padding-block:26px 50px}
.warn{background:var(--warn);color:var(--warn-ink);border-radius:14px;padding:14px 16px;font-size:15.5px;font-weight:500}
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.group h2{font-size:18px;margin-bottom:10px}
.files{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:12px 18px;border-radius:12px;background:var(--go);color:var(--go-ink);font:700 16.5px var(--fb);text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:22px;height:22px;flex:none}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.tips{display:grid;gap:10px;margin-top:22px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15.5px}
.tip b{font-family:var(--fd);font-weight:600;display:block;margin-bottom:2px}
.err{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.more{margin-top:26px;display:grid;gap:10px}
.line{display:inline-block;margin-top:8px;color:var(--brand);font-weight:600}
footer{padding:20px 0 40px;color:var(--muted);font-size:13.5px}
:focus-visible{outline:3px solid var(--go);outline-offset:2px;border-radius:8px}
</style>
</head>
