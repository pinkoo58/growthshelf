<style>
/* Layout: dark teal hero with a fan of real covers, then light sections; bundle card is the visual centre; sticky buy bar on phones. */
:root{
  --bg:#F4F8F7; --surface:#FFFFFF; --ink:#12282C; --muted:#4D6266; --line:#D6E3E1; --tint:#E4F0EE;
  --accent:#0F5C63; --hero:#0B4349; --hero2:#0F5C63; --on-hero:#F2FAF9; --hero-muted:#B5D3D3;
  --saf:#E8851C; --on-saf:#1C1100; --saf-soft:#FCE9D2; --good:#1F7A4D; --bad:#B23A2E; --shadow:0 10px 30px rgba(11,67,73,.12);
  --f-display:'Yatra One','Poppins',serif; --f-body:'Poppins',system-ui,-apple-system,'Segoe UI','Noto Sans Devanagari',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1517; --surface:#12262A; --ink:#E8F1F0; --muted:#9FB6B9; --line:#23393D; --tint:#16302F;
  --accent:#6FD0D6; --hero:#07282C; --hero2:#0C4A50; --saf-soft:#2B2113; --good:#5FCB93; --bad:#F08A7E; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1517; --surface:#12262A; --ink:#E8F1F0; --muted:#9FB6B9; --line:#23393D; --tint:#16302F;
  --accent:#6FD0D6; --hero:#07282C; --hero2:#0C4A50; --saf-soft:#2B2113; --good:#5FCB93; --bad:#F08A7E; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body.has-bar{padding-bottom:84px}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:44px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent);margin-bottom:10px}
.h2{font-size:clamp(26px,6.4vw,38px);margin-bottom:12px}
.lead{color:var(--muted);max-width:60ch}
:lang(hi) .h2,:lang(hi) h1{line-height:1.35}

/* top bar + header */
.offer{background:var(--saf);color:var(--on-saf);font-size:13px;font-weight:600;text-align:center;padding:8px 0}
.offer b{font-weight:700}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:var(--on-hero)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:21px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;text-decoration:none}
.brand i{width:22px;height:22px;border-radius:50%;border:2px solid var(--saf);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--saf)}
.lang{display:inline-flex;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:3px;gap:2px}
.lang button{font:600 13px var(--f-body);border:0;background:transparent;color:var(--on-hero);padding:6px 13px;border-radius:999px;cursor:pointer;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--saf);color:var(--on-saf)}
.lang button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--saf);outline-offset:2px}

/* hero */
.hero{background:radial-gradient(120% 90% at 80% 0%,var(--hero2) 0%,var(--hero) 62%);color:var(--on-hero);padding-block:30px 40px;overflow:hidden}
.hero .wrap{display:grid;gap:22px;align-items:center}
.hero h1{font-size:clamp(30px,8.2vw,52px)}
.hero h1 em{font-style:normal;color:var(--saf)}
.hero p.sub{color:var(--hero-muted);font-size:16px;margin-top:14px;max-width:52ch}
.fan{position:relative;height:250px;margin-top:4px}
.fan img{position:absolute;left:50%;bottom:0;width:112px;border-radius:5px;box-shadow:0 12px 28px rgba(0,0,0,.45);transform:translateX(calc(-50% + var(--x))) rotate(var(--r));z-index:var(--z);background:#fff}
.priceRow{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px 14px;margin-top:20px}
.now{font-family:var(--f-display);font-size:44px;line-height:1;color:#fff}
.was{color:var(--hero-muted);text-decoration:line-through;font-size:18px}
.save{background:var(--saf);color:var(--on-saf);font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px;letter-spacing:.03em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px var(--f-body);text-decoration:none;border-radius:12px;padding:15px 22px;min-height:52px;border:2px solid transparent;cursor:pointer;text-align:center}
.btn.pri{background:var(--saf);color:var(--on-saf);box-shadow:0 6px 0 #B5620E}
.btn.pri:active{transform:translateY(3px);box-shadow:0 3px 0 #B5620E}
.btn.sec{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.ghost{border-color:rgba(255,255,255,.4);color:var(--on-hero)}
.btn.block{display:flex;width:100%}
.ctaRow{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips span{font-size:12.5px;font-weight:500;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px;color:var(--on-hero)}
.chips svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px}

/* proof strip */
.strip{background:var(--surface);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.strip div{padding:16px 8px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip div:nth-child(2n){border-right:0}
.strip div:nth-child(n+3){border-bottom:0}
.strip b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--accent);line-height:1.1}
.strip span{font-size:12.5px;color:var(--muted)}

/* pain */
.pains{display:grid;gap:12px;margin-top:20px}
.pain{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 52px;position:relative}
.pain::before{content:"";position:absolute;left:16px;top:18px;width:22px;height:22px;border-radius:50%;background:var(--bad);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M7 7l10 10M17 7L7 17' stroke='black' stroke-width='3' stroke-linecap='round' fill='none'/></svg>") center/70% no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M7 7l10 10M17 7L7 17' stroke='black' stroke-width='3' stroke-linecap='round' fill='none'/></svg>") center/70% no-repeat}
.fix{margin-top:20px;background:var(--tint);border-radius:14px;padding:18px;font-weight:500}

/* features */
.feats{display:grid;gap:14px;margin-top:22px}
.feat{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.feat .ic{width:44px;height:44px;border-radius:12px;background:var(--saf-soft);display:grid;place-items:center;color:var(--accent)}
.feat .ic svg{width:24px;height:24px}
.feat h3{font-size:19px;margin-bottom:2px}
.feat p{color:var(--muted);font-size:14.5px}

/* bundle offer */
.deal{background:var(--hero);color:var(--on-hero);border-radius:22px;padding:26px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.deal::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(232,133,28,.35);box-shadow:0 0 0 22px rgba(232,133,28,.08)}
.ribbon{display:inline-block;background:var(--saf);color:var(--on-saf);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.deal h2{font-size:clamp(26px,6.5vw,38px);margin:12px 0 6px;position:relative}
.deal ul{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px;position:relative}
.deal li{padding-left:28px;position:relative;font-size:15px}
.deal li::before{content:"";position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:50%;background:var(--saf);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' stroke='black' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>") center/80% no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' stroke='black' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>") center/80% no-repeat}
.deal .priceRow{margin-top:6px;position:relative}
.deal .btn{position:relative}
.micro{font-size:12.5px;color:var(--hero-muted);margin-top:12px;position:relative}

/* books */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.book .cv{border-radius:6px;box-shadow:0 6px 16px rgba(11,67,73,.2);width:100%;aspect-ratio:1/1.414;object-fit:cover;background:var(--tint)}
.book h3{font-size:17px;line-height:1.25}
.book p{font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.book .meta{font-size:12px;color:var(--accent);font-weight:600}
.book .btn{padding:11px 10px;min-height:46px;font-size:14.5px;border-radius:10px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;background:var(--saf-soft);color:var(--ink);padding:3px 9px;border-radius:999px}

/* peek */
.peek{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 16px;margin-top:20px;-webkit-overflow-scrolling:touch}
.peek img{flex:0 0 auto;width:min(66vw,250px);border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow);scroll-snap-align:center;background:#fff}
.hint{font-size:13px;color:var(--muted)}

/* compare */
.cmp{display:grid;gap:14px;margin-top:22px}
.plan{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:22px 18px;position:relative}
.plan.best{border-color:var(--saf)}
.plan .tag{position:absolute;top:-13px;left:18px}
.plan h3{font-size:22px}
.plan .p{font-family:var(--f-display);font-size:38px;line-height:1.1;margin:8px 0 2px}
.plan .p small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:6px}
.plan ul{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:8px;font-size:14.5px}
.plan li{padding-left:26px;position:relative}
.plan li.y::before,.plan li.n::before{content:"";position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:50%}
.plan li.y::before{background:var(--good)}
.plan li.n::before{background:var(--line)}
.plan li.n{color:var(--muted)}

/* steps */
.steps{display:grid;gap:12px;margin-top:20px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 60px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-weight:700}
.step b{display:block;font-weight:600}
.step span{color:var(--muted);font-size:14.5px}

/* honest box + testimonials */
.honest{background:var(--tint);border-radius:18px;padding:22px 18px}
.honest h2{font-size:24px;margin-bottom:8px}
.quotes{display:grid;gap:12px;margin-top:20px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.quote cite{display:block;margin-top:8px;font-size:13px;color:var(--muted);font-style:normal}

/* faq */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px}
summary{cursor:pointer;list-style:none;padding:15px 44px 15px 16px;font-weight:600;position:relative;min-height:48px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:16px;top:10px;font-size:24px;color:var(--accent);line-height:1.2}
details[open] summary::after{content:"\2212"}
details p{padding:0 16px 16px;color:var(--muted);font-size:15px}

/* final */
.final{background:var(--hero);color:var(--on-hero);text-align:center}
.final .wrap{max-width:640px}
.final h2{font-size:clamp(27px,7vw,40px);margin-bottom:10px}
.final p{color:var(--hero-muted)}
.final .priceRow{justify-content:center}
footer{padding:28px 0 36px;font-size:12.5px;color:var(--muted)}
footer p+p{margin-top:8px}

/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.14);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(110%);transition:transform .25s}
.bar.show{transform:none}
.bar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .t{flex:1;min-width:0;line-height:1.25}
.bar .t b{font-family:var(--f-display);font-weight:400;font-size:22px}
.bar .t s{color:var(--muted);font-size:13px;margin-left:6px}
.bar .t span{display:block;font-size:12px;color:var(--muted)}
.bar .btn{padding:12px 18px;min-height:48px;font-size:15px;box-shadow:none;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw;text-align:center}
.thanks{background:var(--good);color:#fff;text-align:center;padding:14px 16px;font-weight:600}

@media(min-width:760px){
  section{padding-block:68px}
  .hero .wrap{grid-template-columns:1.1fr .9fr;gap:40px}
  .fan{height:360px}.fan img{width:168px}
  .strip .wrap{grid-template-columns:repeat(4,1fr)}
  .strip div{border-bottom:0!important;border-right:1px solid var(--line)!important}.strip div:last-child{border-right:0!important}
  .pains,.feats{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .cmp{grid-template-columns:1fr 1.15fr;align-items:stretch}
  .steps{grid-template-columns:repeat(3,1fr)}
  .quotes{grid-template-columns:repeat(3,1fr)}
  .deal{padding:40px}
  .peek img{width:260px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar{transition:none}}
</style>

var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
function track(ev,data){try{ if(window.fbq) window.fbq('track',ev,data||{}); }catch(e){}}

function initPixel(){
  if(!CONFIG.PIXEL_ID) return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  window.fbq('init',CONFIG.PIXEL_ID); window.fbq('track','PageView');
}

function setLang(l,save){
  lang = l; document.documentElement.lang = l==='hi'?'hi':'en';
  $('#lEn').setAttribute('aria-pressed', l==='en'); $('#lHi').setAttribute('aria-pressed', l==='hi');
  var d = T[l];
  $$('[data-t]').forEach(function(el){ el.textContent = d[el.getAttribute('data-t')]; });
  $$('[data-h]').forEach(function(el){ el.innerHTML = d[el.getAttribute('data-h')]; });
  renderFan(); renderGrid(); renderPeek(); renderFeats(); renderFaq(); renderQuotes(); renderOffer(); renderSupport();
  document.title = l==='hi' ? 'VastuShala वास्तु ई-बुक' : 'VastuShala Vastu Ebooks';
  if(save) store('vs_lang', l);
}
function renderFan(){
  var cfg=[[2,'-132px','-14deg',1],[5,'-66px','-7deg',2],[10,'0px','0deg',4],[9,'66px','7deg',3],[7,'132px','14deg',2]];
  $('#fan').innerHTML = cfg.map(function(c){return '<img alt="" src="'+IMG[lang][c[0]]+'" style="--x:'+c[1]+';--r:'+c[2]+';--z:'+c[3]+'">'}).join('');
}
function renderGrid(){
  var d=T[lang];
  $('#grid').innerHTML = BOOKS.map(function(b){
    var title = lang==='hi'?b.hi:b.en, desc = lang==='hi'?b.dh:b.de;
    return '<article class="book"><img class="cv" alt="'+title+'" src="'+IMG[lang][b.n]+'">'+
      '<span class="meta">'+b.pg+' '+d.pages+' · '+d.both+'</span><h3>'+title+'</h3><p>'+desc+'</p>'+
      '<a class="btn sec" href="#" data-buy="b'+b.n+'">'+d.buy1+'</a></article>';
  }).join('');
  bindBuy();
}
function renderPeek(){ $('#peek').innerHTML = IMG[lang==='hi'?'peekHi':'peekEn'].map(function(s){return '<img alt="" src="'+s+'">'}).join(''); }
function renderFeats(){ $('#feats').innerHTML = T[lang].feats.map(function(f){return '<div class="feat"><div class="ic">'+ICONS[f[2]]+'</div><div><h3>'+f[0]+'</h3><p>'+f[1]+'</p></div></div>'}).join(''); }
function renderFaq(){
  $('#faq').innerHTML = T[lang].faq.map(function(q,i){
    if(i===7 && !CONFIG.REFUND_LINE) return '';
    return '<details><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>';
  }).join('');
}
function renderQuotes(){
  var q = CONFIG.TESTIMONIALS||[];
  $('#quotesec').hidden = !q.length;
  $('#quotes').innerHTML = q.map(function(x){return '<div class="quote"><p>“'+(x[lang]||x.en)+'”</p><cite>'+x.name+'</cite></div>'}).join('');
}
function renderSupport(){ var s=$('#support'); s.hidden=!CONFIG.SUPPORT_EMAIL; if(CONFIG.SUPPORT_EMAIL) s.textContent=(lang==='hi'?'डाउनलोड में मदद के लिए: ':'Need help with your download? ')+CONFIG.SUPPORT_EMAIL; }

/* offer bar with optional real countdown */
var cdTimer=null;
function renderOffer(){
  var box=$('#offer .wrap'), d=T[lang];
  if(cdTimer){clearInterval(cdTimer); cdTimer=null;}
  var end = CONFIG.OFFER_END ? Date.parse(CONFIG.OFFER_END) : NaN;
  if(!isNaN(end) && end>Date.now()){
    var tick=function(){
      var s=Math.max(0,Math.floor((end-Date.now())/1000));
      if(s<=0){clearInterval(cdTimer); box.innerHTML=d.offer_plain; return;}
      var dd=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), sec=s%60, p=function(n){return (n<10?'0':'')+n};
      box.innerHTML = d.offer_cd+' <b>'+(dd?dd+(lang==='hi'?' दिन ':'d '):'')+p(h)+':'+p(m)+':'+p(sec)+'</b> · ₹599';
    };
    tick(); cdTimer=setInterval(tick,1000);
  } else box.innerHTML = d.offer_plain;
}

/* buy links + tracking */
var PRICE = {bundle:599};
function bindBuy(){
  $$('[data-buy]').forEach(function(a){
    if(a.__b) return; a.__b=1;
    a.addEventListener('click',function(e){
      var key=a.getAttribute('data-buy'), url=CONFIG.LINKS[key], val=PRICE[key]||129;
      store('vs_last', key);
      track('InitiateCheckout',{value:val,currency:'INR',content_name:key,content_type:'product'});
      if(!url){ e.preventDefault(); toast(T[lang].link_missing); return; }
      a.href=url; a.target='_blank'; a.rel='noopener';
    });
  });
}
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove()},2600); }

/* sticky bar: show after hero, hide near the final CTA */
function barWatch(){
  var bar=$('#bar'), hero=$('.hero'), fin=$('#final');
  document.body.classList.add('has-bar');
  var f=function(){
    var y=window.scrollY||0, past = y > hero.offsetTop+hero.offsetHeight-80;
    var fr=fin.getBoundingClientRect(), nearFinal = fr.top < window.innerHeight-40;
    bar.classList.toggle('show', past && !nearFinal);
  };
  window.addEventListener('scroll',f,{passive:true}); window.addEventListener('resize',f); f();
}
var viewed=false;
function viewWatch(){
  if(!('IntersectionObserver' in window)) return;
  var io=new IntersectionObserver(function(en){ en.forEach(function(x){ if(x.isIntersecting && !viewed){ viewed=true; track('ViewContent',{content_name:'Book list',content_type:'product_group'}); } }); },{threshold:.2});
  io.observe($('#books'));
}
function thanksCheck(){
  if((location.hash||'').indexOf('thanks')===-1) return;
  var k=store('vs_last')||'bundle', v=PRICE[k]||129;
  track('Purchase',{value:v,currency:'INR',content_name:k});
  var t=$('#thanks'); t.textContent=T[lang].thanks; t.hidden=false;
}

(function init(){
  var start='en';
  try{ var q=new URLSearchParams(location.search).get('lang'); if(q==='hi'||q==='en') start=q; else { var s=store('vs_lang'); if(s==='hi'||s==='en') start=s; else if((navigator.language||'').toLowerCase().indexOf('hi')===0) start='hi'; } }catch(e){}
  $('#lEn').addEventListener('click',function(){setLang('en',true)});
  $('#lHi').addEventListener('click',function(){setLang('hi',true)});
  initPixel(); setLang(start,false); bindBuy(); barWatch(); viewWatch(); thanksCheck();
})();
</script>

</html>
