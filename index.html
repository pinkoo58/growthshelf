<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrowthShelf | Practical Ebooks for Everyday Growth</title>
<meta name="description" content="Printable, easy-to-use ebooks on spoken English, focus and productivity, and home Vastu. Instant PDF download. Start from ₹129.">
<link rel="canonical" href="https://growthshelf.in/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website"><meta property="og:site_name" content="GrowthShelf">
<meta property="og:title" content="GrowthShelf | Practical Ebooks for Everyday Growth">
<meta property="og:description" content="Spoken English, focus and productivity, and home Vastu. Printable ebooks with instant download.">
<meta property="og:image" content="https://growthshelf.in/assets/og-home.jpg"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
<style>
/* Layout: ink-navy header and hero with three real covers standing on a shelf, then a light page of
   collection cards (one per landing page, each in its own book colour), a chooser, expectations, FAQ. */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#EAF0F6; --ink:#0F1B2D; --muted:#51627A; --line:#D5DEE9;
  --deep:#0F1B2D; --deep2:#16294A; --deep-ink:#F2F6FB; --deep-muted:#A9B9D0;
  --go:#2EC27E; --go-ink:#06231A; --go-hover:#47D193; --brand:#0F7A55; --shelf:#B98B5A;
  --c-speak:#0F766E; --c-focus:#5B2EFF; --c-vastu:#E8851C; --ok:#1F7A4D;
  --shadow:0 1px 2px rgba(15,27,45,.08),0 10px 28px rgba(15,27,45,.10);
  --f-display:'Poppins','Hind','Noto Sans Devanagari','Nirmala UI',system-ui,sans-serif;
  --f-body:'Hind','Noto Sans Devanagari','Nirmala UI',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#111D31; --surface2:#16253D; --ink:#E8EFF8; --muted:#9DB0C8; --line:#25395A;
  --deep:#08101E; --deep2:#10203A; --brand:#43D6A0; --shelf:#8B6A47; --ok:#4ADE80;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111D31; --surface2:#16253D; --ink:#E8EFF8; --muted:#9DB0C8; --line:#25395A;
  --deep:#08101E; --deep2:#10203A; --brand:#43D6A0; --shelf:#8B6A47; --ok:#4ADE80;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.65;padding-bottom:0}
img{display:block;max-width:100%;height:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
:lang(hi) h1,:lang(hi) h2,:lang(hi) h3{line-height:1.38;letter-spacing:0}
p{margin:0}a{color:inherit}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--go);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.sec{padding-block:54px}
.sec h2{font-size:clamp(26px,5.6vw,38px);margin-top:8px}
.lead{color:var(--muted);max-width:62ch;margin-top:10px;font-size:17.5px}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 24px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:17px;text-decoration:none;text-align:center;transition:transform .12s,background .12s}
.btn:active{transform:translateY(1px)}
.btn-go{background:var(--go);color:var(--go-ink);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.btn-go:hover{background:var(--go-hover)}
.btn-line{border-color:var(--pc,var(--line));color:var(--ink);background:transparent}
.btn-ghost{border-color:rgba(255,255,255,.35);color:var(--deep-ink)}
.btn-block{display:flex;width:100%}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--deep);color:var(--deep-ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--deep)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;text-decoration:none;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.logo svg{width:26px;height:26px;flex:none}
.logo span{color:var(--go)}
.nav{display:none;gap:22px;font-size:15px;font-weight:500}
.nav a{text-decoration:none;color:var(--deep-muted)}.nav a:hover{color:#fff}
.lang{display:inline-flex;border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:var(--deep-ink);font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--go);color:var(--go-ink)}

/* hero */
.hero{background:radial-gradient(110% 100% at 85% 0%,var(--deep2),var(--deep) 65%);color:var(--deep-ink);padding-block:34px 0;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-items:end}
.hero .wrap>*{min-width:0}
.hero .txt{padding-bottom:6px}
.hero .eyebrow{color:var(--go)}
.hero h1{font-size:clamp(33px,8.6vw,54px);margin-top:10px}
.hero h1 em{font-style:normal;color:var(--go)}
.hero .sub{margin-top:14px;font-size:18px;color:var(--deep-muted);max-width:50ch}
.hero .cta{display:grid;gap:12px;margin-top:22px;max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{font-size:13px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;color:var(--deep-ink)}
.shelf{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:9px;height:210px;padding-bottom:0;max-width:100%}
.shelf::after{content:"";position:absolute;left:-20px;right:-20px;bottom:0;height:14px;background:linear-gradient(var(--shelf),#8B6A47);box-shadow:0 -2px 0 rgba(255,255,255,.12) inset}
.shelf>*{position:relative;z-index:1;margin-bottom:14px;flex:none}
.shelf img{width:72px;border-radius:4px 7px 7px 4px;box-shadow:-3px 4px 0 rgba(0,0,0,.35),0 14px 22px rgba(0,0,0,.4);background:#fff}
.shelf img.mid{width:86px}
.fr{width:100px;height:136px;border-radius:4px 7px 7px 4px;background:linear-gradient(170deg,#14123a,#4b1fd6);border-left:6px solid #ff3d81;box-shadow:-3px 4px 0 rgba(0,0,0,.35),0 14px 22px rgba(0,0,0,.4);padding:10px 6px;text-align:center;color:#fff;font-family:'Poppins',sans-serif;overflow:hidden}
.fr.big{width:86px;height:117px;padding:9px 5px}
.fr small{display:block;font-size:4.5px;font-weight:700;background:#ff3d81;border-radius:99px;padding:2px 5px;margin:0 auto 4px;width:max-content;max-width:100%}
.fr b{display:block;font-size:11px;line-height:1;font-weight:800}.fr b span{display:block;font-size:25px;color:#ffc93c;letter-spacing:-.5px}
.fr svg{width:44px;display:block;margin:0 auto 2px}
.fr.big b{font-size:9px}.fr.big b span{font-size:21px}.fr.big svg{width:36px}

/* strip */
.strip{background:var(--surface);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(2,1fr)}
.strip .it{padding:16px 8px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip .it:nth-child(2n){border-right:0}.strip .it:nth-child(n+3){border-bottom:0}
.strip b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.15;color:var(--brand)}
.strip span{font-size:13.5px;color:var(--muted)}

/* collections */
.cols{display:grid;gap:18px;margin-top:26px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:grid}
.pc .vis{background:linear-gradient(160deg,var(--pc),color-mix(in srgb,var(--pc) 55%,#000));position:relative;padding:26px 16px 0;display:flex;justify-content:center;align-items:flex-end;gap:10px;min-height:196px}
.pc .vis::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(var(--shelf),#8B6A47)}
.pc .vis>*{position:relative;z-index:1;margin-bottom:12px}
.pc .vis img{width:86px;border-radius:3px 6px 6px 3px;box-shadow:-2px 3px 0 rgba(0,0,0,.3),0 10px 18px rgba(0,0,0,.35);background:#fff}
.pc .vis img.mid{width:102px}
.pc .vis .fr{width:104px;height:142px}
.pc .vis .fr b{font-size:12px}.pc .vis .fr b span{font-size:26px}.pc .vis .fr svg{width:44px}.pc .vis .fr small{font-size:5px}
.pc .body{padding:20px 18px 20px;display:flex;flex-direction:column;gap:10px}
.pc .tag{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--pc)}
:root[data-theme="dark"] .pc .tag{filter:brightness(1.5)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pc .tag{filter:brightness(1.5)}}
.pc h3{font-size:26px}
.pc .desc{color:var(--muted);font-size:16.5px}
.pc ul{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:7px;font-size:15.5px}
.pc li{position:relative;padding-left:26px}
.pc li::before{content:"";position:absolute;left:0;top:5px;width:17px;height:17px;border-radius:50%;background:var(--pc);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' stroke='black' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>") center/82% no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' stroke='black' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>") center/82% no-repeat}
.pc .price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:6px}
.pc .price b{font-family:var(--f-display);font-size:30px;line-height:1}
.pc .price s{color:var(--muted)}
.pc .price small{color:var(--muted);font-size:14px}
.pc .btn{margin-top:6px;background:var(--pc);color:#fff}
.pc .btn.dk{color:#1c1100}
.pc .btn:hover{filter:brightness(1.08)}

/* chooser */
.choose{background:var(--surface2)}
.chlist{display:grid;gap:12px;margin-top:24px}
.ch{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:14px;padding:16px 16px;text-decoration:none;min-height:64px}
.ch b{font-family:var(--f-display);font-size:17.5px;font-weight:600;line-height:1.3;display:block}
.ch span{color:var(--muted);font-size:14.5px}
.ch i{font-style:normal;font-weight:700;color:var(--pc);white-space:nowrap}
.ch:hover{box-shadow:var(--shadow)}

/* expect */
.exp{display:grid;gap:16px;margin-top:26px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.ex .ic{width:44px;height:44px;border-radius:12px;background:var(--surface2);color:var(--brand);display:grid;place-items:center;margin-bottom:12px}
.ex .ic svg{width:24px;height:24px}
.ex h3{font-size:19px;margin-bottom:4px}
.ex p{color:var(--muted);font-size:15.5px}
.steps{display:grid;gap:12px;margin-top:24px;counter-reset:s}
.st{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 64px;position:relative}
.st::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--deep);color:var(--go);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.st b{display:block;font-family:var(--f-display);font-weight:600}
.st span{color:var(--muted);font-size:15.5px}

.promise{background:var(--deep);color:var(--deep-ink);border-radius:22px;padding:28px 20px}
.promise h2{font-size:clamp(24px,5.4vw,34px)}
.promise p{color:var(--deep-muted);margin-top:12px;max-width:62ch}
.promise ul{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.promise li{padding-left:28px;position:relative}
.promise li::before{content:"";position:absolute;left:0;top:6px;width:18px;height:18px;border-radius:50%;background:var(--go);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' stroke='black' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>") center/82% no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' stroke='black' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>") center/82% no-repeat}

details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px}
summary{cursor:pointer;list-style:none;padding:16px 46px 16px 16px;font-weight:600;position:relative;min-height:52px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:16px;top:10px;font-size:26px;color:var(--brand);line-height:1.2}
details[open] summary::after{content:"\2212"}
details p{padding:0 16px 16px;color:var(--muted);font-size:16px}

.final{background:var(--deep);color:var(--deep-ink)}
.final h2{font-size:clamp(27px,6.6vw,42px);max-width:20ch}
.final p{color:var(--deep-muted);margin-top:10px;max-width:56ch}
.final .row{display:grid;gap:12px;margin-top:22px;max-width:420px}
footer{background:var(--deep);color:var(--deep-muted);padding:8px 0 40px;font-size:14px;border-top:1px solid rgba(255,255,255,.1)}
footer .wrap{display:grid;gap:22px;padding-top:30px}
footer .links{display:flex;flex-wrap:wrap;gap:8px 20px}
footer a{color:var(--deep-ink);text-decoration:none}footer a:hover{text-decoration:underline}
footer .fine{font-size:12.5px;line-height:1.6}

@media(min-width:760px){
  .nav{display:flex}
  .sec{padding-block:76px}
  .hero{padding-block:56px 0}
  .hero .wrap{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px}
  .shelf{height:340px;gap:16px}.shelf img{width:112px}.shelf img.mid{width:136px}
  .fr{width:138px;height:188px}.fr.big{width:136px;height:184px;padding:11px 7px}
  .fr b{font-size:15px}.fr b span{font-size:34px}.fr.big b{font-size:14px}.fr.big b span{font-size:32px}
  .fr small{font-size:6px}.fr svg{width:60px}.fr.big svg{width:56px}
  .strip .wrap{grid-template-columns:repeat(4,1fr)}
  .strip .it{border-bottom:0!important;border-right:1px solid var(--line)!important}.strip .it:last-child{border-right:0!important}
  .cols{grid-template-columns:repeat(3,1fr);gap:20px}
  .pc{grid-template-rows:auto 1fr}
  .exp{grid-template-columns:repeat(4,1fr)}
  .steps{grid-template-columns:repeat(3,1fr)}
  .chlist{grid-template-columns:repeat(3,1fr)}
  .ch{grid-template-columns:1fr;align-content:start}
  .promise{padding:44px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="GrowthShelf">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="21" width="26" height="4" rx="1.5" fill="#B98B5A"/><rect x="6" y="9" width="5" height="12" rx="1" fill="#2EC27E"/><rect x="12.500" y="5" width="5" height="16" rx="1" fill="#F2F6FB"/><rect x="19" y="11" width="5" height="10" rx="1" fill="#2EC27E"/></svg>
      Growth<span>Shelf</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#ebooks" data-t="nav1"></a><a href="#choose" data-t="nav2"></a><a href="#how" data-t="nav3"></a><a href="#faq" data-t="nav4"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button id="lEn" type="button" aria-pressed="true">English</button>
      <button id="lHi" type="button" aria-pressed="false">हिन्दी</button>
    </div>
  </div>
</header>

<main id="top">
<section class="hero">
  <div class="wrap">
    <div class="txt">
      <div class="eyebrow" data-t="hero_eb"></div>
      <h1 data-h="hero_h"></h1>
      <p class="sub" data-t="hero_sub"></p>
      <div class="cta">
        <a class="btn btn-go" href="#ebooks" data-t="hero_cta"></a>
        <a class="btn btn-ghost" href="#choose" data-t="hero_cta2"></a>
      </div>
      <div class="chips"><span data-t="chip1"></span><span data-t="chip2"></span><span data-t="chip3"></span></div>
    </div>
    <div class="shelf" aria-hidden="true">
      <img src="assets/vastushala-1.jpg" alt="">
      <img class="mid" src="assets/speakshala-1.jpg" alt="">
      <div class="fr big"><small>A SELF-HELP GUIDE FOR BUSY MINDS</small><svg viewBox="0 0 100 70"><ellipse cx="34" cy="34" rx="30" ry="28" fill="#ff3d81"/><ellipse cx="66" cy="34" rx="30" ry="28" fill="#ffc93c"/><path d="M50 8v54M26 30q10-8 22 0M74 30q-10-8-22 0M26 46q10 8 22 0M74 46q-10 8-22 0" stroke="#14123a" stroke-width="3" fill="none"/></svg><b>THE FOCUS<span>RESET</span></b></div>
      <img src="assets/speakshala-7.jpg" alt="">
    </div>
  </div>
</section>

<div class="strip"><div class="wrap">
  <div class="it"><b class="num">21</b><span data-t="s1"></span></div>
  <div class="it"><b class="num">630+</b><span data-t="s2"></span></div>
  <div class="it"><b class="num">3</b><span data-t="s3"></span></div>
  <div class="it"><b data-t="s4a"></b><span data-t="s4"></span></div>
</div></div>

<section class="sec" id="ebooks">
  <div class="wrap">
    <div class="eyebrow" data-t="col_eb"></div>
    <h2 data-t="col_h"></h2>
    <p class="lead" data-t="col_sub"></p>
    <div class="cols" id="cols"></div>
  </div>
</section>

<section class="sec choose" id="choose">
  <div class="wrap">
    <div class="eyebrow" data-t="ch_eb"></div>
    <h2 data-t="ch_h"></h2>
    <div class="chlist" id="chlist"></div>
  </div>
</section>

<section class="sec" id="expect">
  <div class="wrap">
    <div class="eyebrow" data-t="ex_eb"></div>
    <h2 data-t="ex_h"></h2>
    <div class="exp" id="exp"></div>
  </div>
</section>

<section class="sec" id="how" style="padding-top:0">
  <div class="wrap">
    <div class="eyebrow" data-t="hw_eb"></div>
    <h2 data-t="hw_h"></h2>
    <div class="steps">
      <div class="st"><b data-t="st1"></b><span data-t="st1d"></span></div>
      <div class="st"><b data-t="st2"></b><span data-t="st2d"></span></div>
      <div class="st"><b data-t="st3"></b><span data-t="st3d"></span></div>
    </div>
  </div>
</section>

<section class="sec" style="padding-top:0">
  <div class="wrap">
    <div class="promise">
      <h2 data-t="pr_h"></h2>
      <p data-t="pr_p"></p>
      <ul><li data-t="pr1"></li><li data-t="pr2"></li><li data-t="pr3"></li><li data-t="pr4"></li></ul>
    </div>
  </div>
</section>

<section class="sec" id="faq" style="padding-top:0">
  <div class="wrap" style="max-width:820px">
    <div class="eyebrow" data-t="fq_eb"></div>
    <h2 data-t="fq_h"></h2>
    <div id="faqList"></div>
  </div>
</section>

<section class="sec final">
  <div class="wrap">
    <h2 data-t="fin_h"></h2>
    <p data-t="fin_p"></p>
    <div class="row" id="finRow"></div>
  </div>
</section>
</main>

<footer>

function renderFaq(){ $('#faqList').innerHTML=T[LANG].faq.map(function(q){return '<details><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>'}).join(''); }
function renderFinal(){
  var d=T[LANG];
  $('#finRow').innerHTML=PRODUCTS.map(function(p,i){return '<a class="btn '+(i===0?'btn-go':'btn-ghost')+'" href="'+p.href+'" data-go="'+p.id+'">'+p[LANG].name+' →</a>'}).join('');
  $('#ftLinks').innerHTML='<a href="#top">'+d.l_home+'</a>'+PRODUCTS.map(function(p){return '<a href="'+p.href+'">'+p[LANG].name+'</a>'}).join('')+'<a href="policies.html">'+d.l_pol+'</a><a href="mailto:'+CONFIG.EMAIL+'">'+CONFIG.EMAIL+'</a>';
}
function setLang(l,save){
  LANG=l; document.documentElement.lang=l;
  $('#lEn').setAttribute('aria-pressed',l==='en'); $('#lHi').setAttribute('aria-pressed',l==='hi');
  var d=T[l];
  $$('[data-t]').forEach(function(e){var v=d[e.getAttribute('data-t')]; if(v!=null) e.textContent=v});
  $$('[data-h]').forEach(function(e){e.innerHTML=d[e.getAttribute('data-h')]});
  renderCols(); renderChooser(); renderExp(); renderFaq(); renderFinal();
  if(save) sset('gs_lang',l);
}
document.addEventListener('click',function(e){ var a=e.target.closest('[data-go]'); if(a) track('SelectCollection',{target:a.getAttribute('data-go')}); });

(function init(){
  var s='en';
  try{ var q=new URLSearchParams(location.search).get('lang'); if(q==='hi'||q==='en') s=q; else { var g=sget('gs_lang'); if(g==='hi'||g==='en') s=g; else if((navigator.language||'').toLowerCase().indexOf('hi')===0) s='hi'; } }catch(e){}
  $('#lEn').addEventListener('click',function(){setLang('en',true)});
  $('#lHi').addEventListener('click',function(){setLang('hi',true)});
  if(CONFIG.PIXEL_ID){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init',CONFIG.PIXEL_ID); window.fbq('track','PageView');
  }
  setLang(s,false);
})();
</script>
</body>
</html>
